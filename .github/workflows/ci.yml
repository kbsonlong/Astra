name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check backend
      - name: Mypy
        run: mypy backend/app/config.py backend/app/core/review_store.py backend/app/core/task_store.py backend/app/core/artifact_retention.py
      - name: Pytest
        run: PYTHONPATH=backend pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
