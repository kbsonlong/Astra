services:
  frontend-nginx:
    build: ./frontend
    environment:
      API_UPSTREAM: "${API_UPSTREAM:-host.docker.internal:8000}"
      NGINX_CLIENT_MAX_BODY_SIZE: "${NGINX_CLIENT_MAX_BODY_SIZE:-500m}"
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
