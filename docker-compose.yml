services:
  fastapi:
    build: ./backend
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://192.168.3.18:8000/v1}
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ASR_ENDPOINT: http://whisper-asr:8080
      TTS_ENDPOINT: http://piper-tts:8080
    depends_on:
      whisper-asr:
        condition: service_healthy
      piper-tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend-nginx:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  whisper-asr:
    image: ${WHISPER_IMAGE:?set a pinned whisper.cpp server image}
    command: ${WHISPER_COMMAND:--host 0.0.0.0 --port 8080}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  piper-tts:
    image: ${PIPER_IMAGE:?set a pinned Piper HTTP server image}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
